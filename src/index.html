<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>ToDo List</title>
    </head>

    <body>
        <!-- SIDEBAR -->
        <div id="sidebar">
            <div class="titleDiv">
                <h2>Dashboard</h2>
                <p>Projects</p>
            </div>
            <div id="projectsContainer">
            </div>
            <button id="createProjectButton">+</button>
        </div>

        <!-- NOTES -->
        <div id="main">
            <div id="todoContainer">
                <!-- PROJECT TITLE -->
                <h2 id="currentTabTitle"></h2>

                <!-- INPUT POPUP -->
                <div id="popupOverlay" class="overlayContainer">
                    <div class="popup-box">
                        <form action="" id="form" class="form-container">

                            <div id="cancelButtonContainer">
                                <div></div>
                                <button id="cancelButton"></button>
                            </div>

                            <div class="inputContainer">
                                <label for="title" class="inputInfo">Title</label>
                                <input type="text" name="" id="title" required>
                            </div>

                            <div class="inputContainer">
                                <label for="description" class="inputInfo">Description</label>
                                <textarea name="" id="description"></textarea>
                            </div>

                            <div class="inputContainer">
                                <label for="dueDate" class="inputInfo">Due Date</label>
                                <input type="date" name="" id="dueDate">
                            </div>

                            <div class="inputContainer">
                                <label for="dueDate" class="inputInfo">Priority</label>
                                <div id="radioButtonContainer">
                                    <input type="radio" name="priority" id="High" required checked>
                                    <label for="radio1">High</label>
                                    <input type="radio" name="priority" id="Medium" required>
                                    <label for="radio2">Medium</label>
                                    <input type="radio" name="priority" id="Low" required>
                                    <label for="radio3">Low</label>
                                </div>
                            </div>

                            <div class="inputContainer">
                                <button id="confirmButton">Add</button>
                            </div>

                        </form>
                    </div>
                </div>
            </div>

            <div class="buttonContainer">
                <button id="addNote">+</button>
            </div>
        </div>
    </body>
</html>

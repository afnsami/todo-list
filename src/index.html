<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <script src="main.js"></script>
        <title>ToDo List</title>
    </head>

    <body>
        <!-- SIDEBAR -->
        <div id="sidebar">
            <div class="titleDiv">
                <h2>Dashboard</h2>
                <p>Projects</p>
            </div>
            <div id="projectsContainer">
            </div>
            <button id="createProjectButton">+</button>
        </div>

        <!-- NOTES -->
        <div id="main">
            <div id="todoContainer">
                <!-- INPUT POPUP -->
                <div id="popupOverlay" class="overlayContainer">
                    <div class="popup-box">
                        <form action="" class="form-container">

                            <div id="cancelButtonContainer">
                                <div></div>
                                <button id="cancelButton"></button>
                            </div>

                            <div class="inputContainer">
                                <label for="title">Title</label>
                                <input type="text" name="" id="title" required>
                            </div>

                            <div class="inputContainer">
                                <label for="description">Description</label>
                                <textarea name="" id="description"></textarea>
                            </div>

                            <div class="inputContainer">
                                <label for="dueDate">Due Date</label>
                                <input type="date" name="" id="dueDate" required>
                            </div>

                            <div class="inputContainer">
                                <label for="dueDate">Priority</label>
                                <div id="radioButtonContainer">
                                    <input type="radio" name="High" id="radio1" required>
                                    <label for="radio1">High</label>
                                    <input type="radio" name="High" id="radio2" required>
                                    <label for="radio1">Medium</label>
                                    <input type="radio" name="High" id="radio3" required>
                                    <label for="radio1">Low</label>
                                </div>
                            </div>

                            <div class="inputContainer">
                                <button id="confirmButton">Add</button>
                            </div>

                        </form>
                    </div>
                </div>
            </div>

            <div class="buttonContainer">
                <button id="addNote">+</button>
            </div>
        </div>
    </body>
</html>
